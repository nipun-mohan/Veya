name: veya
description: Your voice, beautifully expressed. Multilingual dictation and writing assistant.
publish_to: none
version: 1.3.0+14
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^10.0.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  default-flavor: standard
  uses-material-design: true
  assets:
    - assets/i18n/
    - assets/branding/
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
